<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Battle of Talingchan - Lobby</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { --gold: #ffc107; --bg: #121212; --panel: #1e1e1e; --border: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        .lobby-container { display: grid; grid-template-columns: 350px 400px; gap: 30px; background: var(--panel); padding: 40px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        
        h2 { color: var(--gold); margin-top: 0; border-bottom: 2px solid var(--gold); padding-bottom: 10px; display: inline-block; }
        
        .left-panel, .right-panel { display: flex; flex-direction: column; gap: 15px; }
        
        input, select { background: #2a2a2a; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; }
        
        button { padding: 12px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; transition: 0.3s; }
        .btn-create { background: var(--gold); color: #000; }
        .btn-create:hover { background: #e0a800; transform: translateY(-2px); }
        .btn-refresh { background: #444; color: white; }

        .room-list-box { background: #000; height: 350px; overflow-y: auto; padding: 15px; border-radius: 10px; border: 1px solid var(--border); }
        .room-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #222; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid var(--gold); }
        .room-row button { background: #28a745; color: white; padding: 5px 15px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="lobby-container">
        <div class="left-panel">
            <h2>⚔️ Talingchan Lobby</h2>
            <div id="user-info" style="font-size: 0.9em; color: #aaa;">ผู้เล่น: -</div>
            <button onclick="window.location.href='./deckbuilder.html'">🎴 จัดเด็คของคุณ</button>
            <select id="deck-selector"><option>เลือกเด็คที่ใช้...</option></select>
            <input type="text" id="room-input" placeholder="ตั้งชื่อห้อง...">
            <button class="btn-create" onclick="hostPublicGame()">🌐 สร้างห้อง</button>
        </div>
        <div class="right-panel">
            <button class="btn-refresh" onclick="socket.emit('get-rooms')">🔄 รีเฟรชรายชื่อห้อง</button>
            <div class="room-list-box" id="room-list-container">
                <div style="text-align:center; margin-top:20px; color:#555;">กำลังโหลดห้อง...</div>
            </div>
        </div>
    </div>
    <script>
        const currentUser = sessionStorage.getItem('currentUsername') || 'Guest';
        document.getElementById('user-info').innerText = `ผู้เล่น: ${currentUser}`;
        const socket = io();
    
        // เพิ่มส่วนนี้: ขอรายชื่อห้องทันทีที่เชื่อมต่อสำเร็จ
        socket.on('connect', () => {
            socket.emit('get-rooms');
        });

        socket.on('update-room-list', (rooms) => {
            const container = document.getElementById('room-list-container');
            container.innerHTML = '';
        
            const roomKeys = Object.keys(rooms);
            if (roomKeys.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#555; padding-top:20px;">ยังไม่มีห้องในขณะนี้</div>';
                return;
            }

            roomKeys.forEach(r => {
                container.innerHTML += `<div class="room-row">
                    <div>${r} <small>(${rooms[r].playersCount}/2)</small></div>
                    <button onclick="joinRoom('${r}')">Join</button>
                </div>`;
            });
        });
        
        // โหลดเด็ค
        const allDecks = JSON.parse(localStorage.getItem('allUsersDecks') || '{}');
        const userDecks = allDecks[currentUser] || {};
        Object.keys(userDecks).forEach(n => {
            const opt = document.createElement('option');
            opt.value = n; opt.innerText = n;
            document.getElementById('deck-selector').appendChild(opt);
        });

        socket.on('update-room-list', (rooms) => {
            const container = document.getElementById('room-list-container');
            container.innerHTML = '';
            Object.keys(rooms).forEach(r => {
                container.innerHTML += `<div class="room-row"><div>${r} <small>(${rooms[r].playersCount}/2)</small></div>
                <button onclick="joinRoom('${r}')">Join</button></div>`;
            });
        });

        function hostPublicGame() {
            const name = document.getElementById('room-input').value.trim();
            const d = document.getElementById('deck-selector').value;
            
            if (name && d && d !== "เลือกเด็คที่ใช้...") {
                const allDecks = JSON.parse(localStorage.getItem('allUsersDecks') || '{}');
                const userDeck = allDecks[currentUser]?.[d] || [];

                // 1. บันทึกข้อมูลลง sessionStorage
                sessionStorage.setItem('gameRoom', name);
                sessionStorage.setItem('selectedDeck', JSON.stringify(userDeck));

                // 2. ยิงสร้างห้องอย่างเดียว (ห้ามยิง join-room ตรงนี้)
                socket.emit('create-room', name);
            } else {
                alert("โปรดตั้งชื่อห้องและเลือกเด็คให้เรียบร้อยครับ");
            }
        }

        // เมื่อเซิร์ฟเวอร์สร้างห้องสำเร็จ ให้เปลี่ยนหน้าไปยัง index.html ทันที
        socket.on('room-created', (roomName) => {
            window.location.href = './index.html';
        });

        function joinRoom(r) {
            const d = document.getElementById('deck-selector').value;
            if (!d || d === "เลือกเด็คที่ใช้...") return alert("เลือกเด็คก่อนเข้าห้องครับ");

            const allDecks = JSON.parse(localStorage.getItem('allUsersDecks') || '{}');
            const userDeck = allDecks[currentUser]?.[d] || [];

            // 1. บันทึกข้อมูลลง sessionStorage
            sessionStorage.setItem('gameRoom', r);
            sessionStorage.setItem('selectedDeck', JSON.stringify(userDeck));

            // 2. เปลี่ยนหน้าเลย (ห้ามยิง socket.emit('join-room') ในหน้านี้)
            window.location.href = './index.html';
        }
    </script>
</body>
</html>
