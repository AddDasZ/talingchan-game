<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Battle of Talingchan - Login</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #121212; color: #fff; margin: 0; }
        .login-box { background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); width: 350px; text-align: center; border: 1px solid #333; }
        h2 { color: #ffc107; margin-top: 0; }
        input { width: 100%; padding: 10px; margin: 15px 0; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; color: white; background: #007bff; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>⚔️ เข้าสู่ระบบ</h2>
        <input type="text" id="username-input" placeholder="ชื่อผู้เล่น...">
        <button onclick="handleLogin()">🚀 เข้าสู่ Lobby</button>
    </div>

    <script>
        const socket = io();

        socket.on('connect', () => {
            console.log("เชื่อมต่อ Server สำเร็จ!");
        });

        function handleLogin() {
            const username = document.getElementById('username-input').value.trim();
            if (!username) return alert("กรุณากรอกชื่อ");

            // ตรวจสอบว่าเชื่อมต่ออยู่หรือไม่ก่อนส่ง
            if (!socket.connected) return alert("ยังไม่ได้เชื่อมต่อ Server!");

            // เรียกใช้ Event ที่เพิ่มใน server.js[cite: 12]
            socket.emit('user-login', { username }, (response) => {
                if (response && response.success) {
                    sessionStorage.setItem('currentUsername', username);
                    window.location.href = './lobby.html';
                }
            });
        }
    </script>
</body>
</html>
